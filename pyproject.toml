[project]
name = "domaincheck"
version = "0.1.0"
description = "Verified-ownership email security and web hygiene checker with plain-English fix steps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "dnspython>=2.6",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "publicsuffixlist>=1.0",
    "idna>=3.7",
    "cryptography>=42",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pypdf>=4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*", "fixes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "E501"]
"scripts/**" = ["S105", "S106", "E501"]
"app/web/pdf.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
